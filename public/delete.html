```html
<!-- To delete student data -->
<!DOCTYPE html>
<html>

<head>
    <title>Delete Student</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>DELETE STUDENT</h1>
<hr>

<a href="index.html">Home</a> |
<a href="list.html">List Students</a> |
<a href="listOne.html">List Required Student</a> |
<a href="insert.html">Insert Student</a> |
<a href="update.html">Update Student</a> |
<a href="delete.html">Delete Student</a>

<hr>

Student to Delete:

<select id="sno">
    <option value="">-- Select Student --</option>
</select>

<br><br>

<button onclick="deleteStudent()">Delete</button>

<br><br>

<button onclick="location.href='index.html'">
    Home Page
</button>


<script>

// Fetch students from MySQL
function loadStudents()
{
    fetch("/students")
    .then(response => response.json())
    .then(students => {

        let dropdown = document.getElementById("sno");

        students.forEach(student => {

            let option = document.createElement("option");

            // Actual student_id from MySQL
            option.value = student.student_id;

            // Display student ID and name
            option.textContent =
                student.student_id + " - " + student.student_name;

            dropdown.appendChild(option);

        });

    })
    .catch(error => {

        console.log(error);
        alert("Unable to fetch students");

    });
}


// Delete selected student
function deleteStudent()
{
    let sno = document.getElementById("sno").value;

    if(sno === "")
    {
        alert("Please select a student");
        return;
    }

    if(confirm("Are you sure you want to delete Student ID " + sno + "?") == false)
        return;

    fetch("/students/" + sno, {
        method: "DELETE"
    })

    .then(response => {

        if(response.ok)
            return response.text();

        return response.text().then(message => {
            throw new Error(message);
        });

    })

    .then(message => {

        alert(message);

        location.href = "index.html";

    })

    .catch(error => {

        alert(error.message);

    });
}


// Load students when page opens
loadStudents();

</script>

</body>

</html>
```
